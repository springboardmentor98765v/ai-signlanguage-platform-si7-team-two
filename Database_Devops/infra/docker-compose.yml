# ============================================================
# Production-ready Docker Compose
# AI-Powered Sign Language Learning & Assessment Platform
#
# Services:
#   - PostgreSQL database
#   - FastAPI backend
#   - AI service
#
# Production environment:
#   .env.production
#
# Run from repository root:
#
#   docker compose --env-file .env.production -f Database_Devops/infra/docker-compose.yml up -d --build
#
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: signlang_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-signlang_platform}
      POSTGRES_USER: ${DB_USER:-signlang_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - signlang_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-signlang_app} -d ${DB_NAME:-signlang_platform}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    # Database is intentionally not exposed directly to the host.
    # Backend communicates with PostgreSQL through the Docker network.
    expose:
      - "5432"


  # ----------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------
  backend:
    build:
      # Build context is the repository root because the backend
      # needs both Backend/ and Database_Devops/db/.
      context: ../..
      dockerfile: Database_Devops/backend/Dockerfile

    container_name: signlang_backend
    restart: unless-stopped

    env_file:
      - ../../.env.production

    environment:
      # Inside Docker, PostgreSQL is reachable using the service
      # name "db", not localhost.
      DATABASE_URL: postgresql://${DB_USER:-signlang_app}:${DB_PASSWORD}@db:5432/${DB_NAME:-signlang_platform}

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      # Persist generated certificate PDFs across container restarts.
      - certificates_data:/app/generated_certificates

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ----------------------------------------------------------
  # AI Service
  # ----------------------------------------------------------
  ai-service:
    build:
      # The AI service is self-contained inside
      # Database_Devops/ai-service/.
      context: ../ai-service
      dockerfile: Dockerfile

    container_name: signlang_ai_service
    restart: unless-stopped

    env_file:
      - ../../.env.production

    # AI Dockerfile exposes port 8500.
    ports:
      - "8500:8500"


# ============================================================
# Persistent Volumes
# ============================================================

volumes:

  signlang_pgdata:
    name: signlang_pgdata

  certificates_data:
    name: signlang_certificates