# Database_Devops/backup — optional free daily backup via GitHub Actions.
#
# Milestone 2, Day 6 (Intern 5: Database & DevOps)
#
# Requires one GitHub repo secret:
#   DATABASE_URL — the full Postgres connection string
#   (Settings → Secrets and variables → Actions → New repository secret)
#
# Never put the real connection string directly in this file.
#
# On the free GitHub Actions tier this costs $0 and runs in < 2 minutes.

name: Daily Database Backup

on:
  schedule:
    - cron: "0 2 * * *"    # every day at 02:00 UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install postgresql-client (for pg_dump)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install Python deps
        run: pip install python-dotenv

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python Database_Devops/backup/scripts/backup_db.py

      - name: Upload backup as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: Database_Devops/backup/backups/
          retention-days: 30
